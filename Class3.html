<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Forms</title> 
    <style>
        div{
            width: 400px;
            height: 450px;
            margin:auto;
            padding:10px;
       
       border: 3px solid pink; 
        
    }
    form{
        display: flex;
        flex-direction: column;
        padding: 10px;
        /* gap: 10px; */
    }
        input {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
            text-align: center;
            margin-left: 80px;
        }
        label{
            margin-left: 80px;
            gap:10px;
        } 
        textarea{
            margin-left: 80px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        } 
        button{
            padding: 10px;
            color: black;
            background-color: pink;
            margin-top: 10px;
            width: 300px;
            margin-left:80px;
            border: 1px solid black;
        
        } 
    
    </style>
</head>
<body>
        <div>
        <h2 style="text-align: center;">
            Contact Us
        </h2>
    
        <form>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required placeholder="Enter Your Name">

            <label for="name">Email</label>
            <input type="email" id="email" name="email" required placeholder="Enter Your Email">

            <label for="contactno">Contact No.</label>
            <input type="text" id="contacno" name="contactno" required placeholder="Enter Your Contact No.">

            <label for="message">
                Message
            </label>
            <textarea type="message" id="message" name="message" required placeholder="Enter Your Message"></textarea>

            <button type="submit">
                Submit

            </button>



        </form>

    </div>

</body>
</html>
