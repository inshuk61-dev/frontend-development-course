<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <style>
        form {
            display: flex;
            flex-direction: column;
        }

        .form {
            width: 370px;
            height: 440px;
            margin: auto;
            padding: 10px;

            border: 3px solid lavender;

        }

        input {

            gap: 10px;
            padding: 10px;
            text-align: center;

        }

        label {

            gap: 10px;
        }

        button {
            padding: 10px;
            color: black;
            background-color: pink;
            margin-top: 10px;


            border: 1px solid black;
            cursor: pointer;

        }
    </style>

</head>

<body>
    <div class="form">
        <form>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter Your Name">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter Your Email">

            <label for="contactno">Contact No.</label>
            <input type="text" id="contactno" name="contacno" placeholder="Enter Your Contact No.">

            <legend> Gender</legend>
            <label for="gender">
                <input type="radio" id="male" name="gender" value="male" />Male</label>
            <label for="gender">
                <input type="radio" id="female" name="gender" value="female">Female</label>

            <legend>Languages</legend>
            <label for="Languages">
                <input type="checkbox" id="html" name="Languages" value="html">HTML
            </label>
            <label for="Languages">
                <input type="checkbox" id="CSS" name="Languages" value="CSS">CSS
            </label>
            <label for="Languages">
                <input type="checkbox" id="javascript" name="Languages" value="javascript">Javascript
            </label>
            <label for="Languages">
                <input type="checkbox" id="react" name="Languages" value="react">React
            </label>

            <label for="password">Password</label>
            <input type="password" id="Password" name="Password">

            <button type="submit">Submit</button>
        </form>
    </div>
    <hr>
    <div>
        <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3307.287939534173!2d72.64379967380515!3d34.010819219919746!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x38deff9741c90051%3A0x89d7dc27fe094c73!2sLexus%20Developers!5e0!3m2!1sen!2s!4v1783924148023!5m2!1sen!2s"
            width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"></iframe>

    </div>

</body>

</html>
